<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: #1d2433;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf3;
  }
  svg {
    width: 100%;
    max-width: 960px;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
    display: block;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  button {
    font: inherit;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid #4a5670;
    background: #2b3448;
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: #36415a; }
  label { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 480" role="img" aria-labelledby="t">
  <title id="t">一只鹈鹕骑着自行车向前行驶</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2"/>
      <stop offset="1" stop-color="#d9f0ff"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07a2a"/>
    </linearGradient>
    <radialGradient id="bodyShade" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="38" ry="16"/>
      <ellipse cx="-22" cy="-4" rx="22" ry="14"/>
      <ellipse cx="18" cy="-12" rx="24" ry="18"/>
    </g>
    <g id="wheel">
      <circle r="60" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="55" fill="none" stroke="#9aa3ad" stroke-width="2.5"/>
      <g stroke="#b8c0c8" stroke-width="1.5">
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-38.9" y1="-38.9" x2="38.9" y2="38.9"/>
        <line x1="-38.9" y1="38.9" x2="38.9" y2="-38.9"/>
        <line x1="-21" y1="-50.8" x2="21" y2="50.8"/>
        <line x1="-50.8" y1="-21" x2="50.8" y2="21"/>
        <line x1="-21" y1="50.8" x2="21" y2="-50.8"/>
        <line x1="-50.8" y1="21" x2="50.8" y2="-21"/>
      </g>
      <circle r="7" fill="#6b7480"/>
      <circle r="3" fill="#333"/>
    </g>
    <path id="foot" d="M-6,-2 Q4,-6 14,-3 L24,2 L18,4 L22,8 L12,7 L14,11 L-2,8 Q-9,4 -6,-2 Z"/>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="660" cy="80" r="40" fill="#ffe27a"/>
  <circle cx="660" cy="80" r="56" fill="#ffe27a" opacity=".25"/>

  <!-- 云（视差） -->
  <g id="clouds" fill="#fff" opacity=".9">
    <use href="#cloud" x="120" y="70"/>
    <use href="#cloud" x="420" y="110" transform="scale(1)"/>
    <use href="#cloud" x="720" y="55"/>
    <use href="#cloud" x="920" y="70"/>
    <use href="#cloud" x="1220" y="110"/>
    <use href="#cloud" x="1520" y="55"/>
  </g>

  <!-- 远山（视差） -->
  <g id="hills">
    <path fill="#8fcf8a" d="M0,330 Q100,250 200,320 T400,310 T600,300 T800,330 L800,420 L0,420 Z"/>
    <path fill="#8fcf8a" d="M800,330 Q900,250 1000,320 T1200,310 T1400,300 T1600,330 L1600,420 L800,420 Z"/>
  </g>

  <!-- 路边树木（视差） -->
  <g id="trees">
    <g transform="translate(90,0)">
      <rect x="-5" y="330" width="10" height="60" fill="#7a5130"/>
      <circle cx="0" cy="320" r="28" fill="#4d9e4a"/>
    </g>
    <g transform="translate(480,0)">
      <rect x="-5" y="340" width="10" height="50" fill="#7a5130"/>
      <circle cx="0" cy="330" r="22" fill="#5aae55"/>
    </g>
    <g transform="translate(890,0)">
      <rect x="-5" y="330" width="10" height="60" fill="#7a5130"/>
      <circle cx="0" cy="320" r="28" fill="#4d9e4a"/>
    </g>
    <g transform="translate(1280,0)">
      <rect x="-5" y="340" width="10" height="50" fill="#7a5130"/>
      <circle cx="0" cy="330" r="22" fill="#5aae55"/>
    </g>
  </g>

  <!-- 地面与道路 -->
  <rect y="388" width="800" height="92" fill="#6cbf5f"/>
  <rect y="414" width="800" height="50" fill="#6b6f78"/>
  <line id="roadLine" x1="0" y1="439" x2="800" y2="439" stroke="#f4f1e6" stroke-width="4" stroke-dasharray="36 28"/>
  <ellipse cx="380" cy="424" rx="200" ry="8" fill="#000" opacity=".18"/>

  <!-- 骑手 + 自行车 -->
  <g id="rider">
    <!-- 远侧的腿和脚踏（在车架后面） -->
    <path id="farLeg" fill="none" stroke="#c97f2a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <use id="farFoot" href="#foot" fill="#c97f2a"/>
    <line id="farCrank" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <rect id="farPedal" width="18" height="5" rx="2" fill="#333"/>

    <!-- 车轮 -->
    <g transform="translate(260,360)"><g id="rearWheel"><use href="#wheel"/></g></g>
    <g transform="translate(500,360)"><g id="frontWheel"><use href="#wheel"/></g></g>

    <!-- 链条与牙盘 -->
    <g fill="none" stroke="#555" stroke-width="2.5">
      <path d="M260,351 L360,346 M260,369 L360,384"/>
    </g>
    <circle cx="260" cy="360" r="9" fill="none" stroke="#666" stroke-width="3"/>
    <g transform="translate(360,365)">
      <g id="chainring">
        <circle r="19" fill="#c9ced6" stroke="#555" stroke-width="3" stroke-dasharray="3 2"/>
        <circle r="10" fill="none" stroke="#777" stroke-width="2"/>
        <line x1="-19" y1="0" x2="19" y2="0" stroke="#777" stroke-width="2"/>
        <line x1="0" y1="-19" x2="0" y2="19" stroke="#777" stroke-width="2"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#d6392f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M260,360 L360,365 L336,270 Z"/>   <!-- 后下叉/立管/后上叉 -->
      <path d="M336,270 L470,262 L360,365"/>     <!-- 上管/下管 -->
      <path d="M470,262 L480,292"/>              <!-- 头管 -->
    </g>
    <path d="M478,286 L500,360" stroke="#b02a22" stroke-width="7" stroke-linecap="round"/> <!-- 前叉 -->
    <!-- 车把 -->
    <path d="M470,262 L464,236 L486,230 Q498,228 494,244" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 车座 -->
    <path d="M334,268 L330,250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M305,246 Q330,238 352,248 Q332,256 305,252 Z" fill="#2a2a2a"/>
    <!-- 挡泥板 -->
    <path d="M214,322 A62,62 0 0 1 306,310" fill="none" stroke="#e9ecef" stroke-width="5" stroke-linecap="round"/>
    <path d="M458,304 A62,62 0 0 1 553,330" fill="none" stroke="#e9ecef" stroke-width="5" stroke-linecap="round"/>

    <!-- 鹈鹕本体（随踩踏起伏） -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M290,210 L246,196 L258,212 L240,218 L262,224 L250,236 L296,228 Z" fill="#cfd5de"/>
      <!-- 近侧的腿（部分被身体遮住） -->
      <path id="nearLeg" fill="none" stroke="#f0a23c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 身体 -->
      <ellipse cx="342" cy="214" rx="66" ry="44" transform="rotate(-18 342 214)" fill="url(#bodyShade)" stroke="#c4cad3" stroke-width="2"/>
      <!-- 翅膀：伸向车把 -->
      <g id="wing">
        <path d="M318,200 Q360,176 404,196 Q446,214 482,232 Q470,240 446,236 Q456,246 440,246 Q420,246 400,240 Q408,252 390,250 Q350,246 322,228 Q306,214 318,200 Z"
              fill="#e6e9ee" stroke="#b8bfc9" stroke-width="2"/>
        <path d="M440,226 Q462,232 482,232 Q470,240 446,236 Q456,246 440,246 Q420,246 400,240 Q420,236 440,226 Z" fill="#3a3f48"/>
        <path d="M340,214 Q370,222 400,224 M350,228 Q380,236 410,236" fill="none" stroke="#c6ccd5" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- 脖子与头 -->
      <g id="head">
        <path d="M372,196 Q402,180 396,150 Q390,124 414,110 L432,124 Q414,134 418,156 Q424,190 392,214 Z" fill="#f4f5f8" stroke="#c4cad3" stroke-width="2"/>
        <circle cx="424" cy="114" r="20" fill="#fbfbfd" stroke="#c4cad3" stroke-width="2"/>
        <!-- 头顶冠羽 -->
        <path d="M412,98 Q404,84 396,88 Q404,92 408,100 Z M418,96 Q414,80 404,80 Q412,88 414,98 Z" fill="#f6dd8a"/>
        <!-- 喉囊 -->
        <path d="M434,124 Q470,166 540,140 L556,134 Q520,138 438,118 Z" fill="url(#pouch)" stroke="#d26a20" stroke-width="1.5"/>
        <!-- 上喙 -->
        <path d="M436,108 Q500,112 562,128 Q566,133 556,134 Q500,128 436,124 Z" fill="#f6c453" stroke="#c98f22" stroke-width="1.5"/>
        <path d="M556,128 Q566,130 564,136 L556,134 Z" fill="#e07020"/>
        <!-- 眼睛 -->
        <circle cx="430" cy="110" r="5.5" fill="#fff" stroke="#999" stroke-width="1"/>
        <circle id="pupil" cx="432" cy="110" r="3" fill="#1b1b1b"/>
        <path d="M424,104 Q430,100 437,104" fill="none" stroke="#e8b5a0" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 近侧曲柄、脚踏和脚（在最前面） -->
    <line id="nearCrank" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <rect id="nearPedal" width="20" height="6" rx="2" fill="#222"/>
    <use id="nearFoot" href="#foot" fill="#f0a23c"/>
  </g>

  <!-- 速度线 -->
  <g id="speedLines" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="150" y1="250" x2="190" y2="250"/>
    <line x1="130" y1="290" x2="180" y2="290"/>
    <line x1="160" y1="330" x2="195" y2="330"/>
  </g>
</svg>

<div class="controls">
  <button id="toggle" type="button">暂停</button>
  <label>速度 <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('scene');

  // 几何参数
  const BB = { x: 360, y: 365 };   // 牙盘中心
  const CRANK = 22;                // 曲柄长度
  const HIP = { x: 344, y: 246 };  // 髋关节（起伏前）
  const THIGH = 64, SHIN = 64;     // 大腿/小腿长度
  const WHEEL_R = 60;
  const GEAR = 2.4;                // 车轮转速 / 牙盘转速

  const BASE_SPEED = 180;          // 像素/秒
  let speedFactor = 1;
  let running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let distance = 0;
  let last = null;

  // 两段腿的逆运动学：给定髋和脚踏位置，求膝盖（膝盖朝前）
  function legPath(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = THIGH + SHIN - 0.01;
    const minD = Math.abs(THIGH - SHIN) + 0.01;
    d = Math.min(Math.max(d, minD), maxD);
    const a = Math.atan2(dy, dx);
    const off = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
    const knee = { x: hip.x + THIGH * Math.cos(a - off), y: hip.y + THIGH * Math.sin(a - off) };
    return `M${hip.x.toFixed(1)},${hip.y.toFixed(1)} L${knee.x.toFixed(1)},${knee.y.toFixed(1)} L${foot.x.toFixed(1)},${foot.y.toFixed(1)}`;
  }

  function placeCrank(lineEl, pedalEl, footEl, legEl, angle, hip, pw, ph) {
    const px = BB.x + CRANK * Math.cos(angle);
    const py = BB.y + CRANK * Math.sin(angle);
    lineEl.setAttribute('x1', BB.x); lineEl.setAttribute('y1', BB.y);
    lineEl.setAttribute('x2', px);   lineEl.setAttribute('y2', py);
    pedalEl.setAttribute('x', px - pw / 2);
    pedalEl.setAttribute('y', py - ph / 2);
    // 脚掌踩在脚踏上方，脚踝略高于脚踏
    const ankle = { x: px - 4, y: py - 8 };
    footEl.setAttribute('transform', `translate(${ankle.x},${ankle.y})`);
    legEl.setAttribute('d', legPath(hip, ankle));
  }

  const wrap = (v, w) => ((v % w) + w) % w;

  function render() {
    const wheelAngle = distance / WHEEL_R;               // 弧度
    const crankAngle = wheelAngle / GEAR;
    const wheelDeg = wheelAngle * 180 / Math.PI;

    $('rearWheel').setAttribute('transform', `rotate(${wheelDeg})`);
    $('frontWheel').setAttribute('transform', `rotate(${wheelDeg})`);
    $('chainring').setAttribute('transform', `rotate(${crankAngle * 180 / Math.PI})`);

    // 踩踏时身体轻微起伏、头部前后点动
    const bob = Math.sin(crankAngle * 2) * 2.5;
    const nod = Math.sin(crankAngle * 2 + 0.6) * 2;
    $('pelican').setAttribute('transform', `translate(0,${bob})`);
    $('head').setAttribute('transform', `rotate(${nod} 392 200)`);
    $('wing').setAttribute('transform', `rotate(${-bob * 0.3} 330 210)`);

    const hip = { x: HIP.x, y: HIP.y + bob };
    placeCrank($('nearCrank'), $('nearPedal'), $('nearFoot'), $('nearLeg'), crankAngle, hip, 20, 6);
    placeCrank($('farCrank'), $('farPedal'), $('farFoot'), $('farLeg'), crankAngle + Math.PI, hip, 18, 5);

    // 视差滚动背景
    $('roadLine').setAttribute('stroke-dashoffset', distance);
    $('trees').setAttribute('transform', `translate(${-wrap(distance * 0.7, 800)},0)`);
    $('hills').setAttribute('transform', `translate(${-wrap(distance * 0.25, 800)},0)`);
    $('clouds').setAttribute('transform', `translate(${-wrap(distance * 0.08, 800)},0)`);

    // 速度线：随速度显隐并闪动
    const sl = $('speedLines');
    sl.setAttribute('opacity', (Math.min(speedFactor, 3) / 3 * 0.8 * (0.6 + 0.4 * Math.sin(distance / 15))).toFixed(2));
    sl.setAttribute('transform', `translate(${-wrap(distance * 0.5, 40)},0)`);
  }

  function frame(t) {
    if (last !== null && running) {
      const dt = Math.min((t - last) / 1000, 0.05);
      distance += BASE_SPEED * speedFactor * dt;
    }
    last = t;
    render();
    requestAnimationFrame(frame);
  }

  const btn = $('toggle');
  const syncBtn = () => { btn.textContent = running ? '暂停' : '播放'; };
  btn.addEventListener('click', () => { running = !running; syncBtn(); });
  svg.addEventListener('click', () => { running = !running; syncBtn(); });
  $('speed').addEventListener('input', e => { speedFactor = parseFloat(e.target.value); });
  syncBtn();

  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
